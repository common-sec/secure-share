# pip supply-chain hardening: the pip equivalent of .npmrc.
# Containers use it through PIP_CONFIG_FILE (compose.yaml); locally: PIP_CONFIG_FILE=pip.conf.

[global]
# No interactive prompts, no "new pip available" checks.
no-input = true
disable-pip-version-check = true

[install]
# Every requirement must be pinned with its SHA-256 hash, transitive dependencies included
# (tests/requirements.txt). A tampered or substituted file fails to install.
require-hashes = true

# Wheels only: never download a source distribution, so no package build code (setup.py, build
# backends) ever runs on install. This is pip's equivalent of npm's ignore-scripts=true.
only-binary = :all:

# Only consider files uploaded at least 7 days ago (pip >= 26.0; ISO-8601 duration), matching
# .npmrc min-release-age=7 and the Dependabot cooldown.
uploaded-prior-to = P7D
