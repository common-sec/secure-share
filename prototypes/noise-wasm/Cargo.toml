[package]
name = "noise-wasm"
version = "0.0.0"
edition = "2021"
publish = false
description = "Prototype: snow's Noise IK handshake with a PSK for the browser (study for 0.9.0)"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib"]

[features]
# Exposes fixed ephemeral keys so the published test vectors can be replayed.
# Never enabled in a build meant for the app.
test-vectors = []

[dependencies]
# Only the primitives this suite needs: 25519, ChaCha20-Poly1305, SHA-256.
# Not "std": in snow 0.10 it also turns on ring, which does not build for wasm here.
snow = { version = "=0.10.0", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
