<!doctype html>
<html lang="en" data-root="{{root}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Scripts only from this site: the whole app, Trystero included, is bundled at build time.
       The JSON-LD below is data (type application/ld+json): it never executes. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self' wss:; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{url}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{app}}">
  <meta property="og:title" content="{{ogTitle}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="{{image}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{imageAlt}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ogTitle}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{image}}">
  <meta name="twitter:image:alt" content="{{imageAlt}}">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171a21" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
  <link rel="icon" href="{{root}}favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{root}}apple-touch-icon.png">
  <link rel="manifest" href="{{root}}site.webmanifest">
  <link rel="stylesheet" href="{{root}}styles.css">
{{head}}
</head>
<body data-tool="{{tool}}">
  <header class="topbar">
{{header}}
  </header>
  <main id="main" class="container">
{{body}}
  </main>
  <footer class="footer container">
{{footer}}
  </footer>
</body>
</html>
