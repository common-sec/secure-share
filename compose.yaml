# Every task runs in its own container. Two images are built from the Dockerfile (`dev`, `test`);
# the rest are official images used as-is. Images are pinned by tag (for humans and Dependabot)
# and multi-platform digest (what actually runs, on amd64 and arm64 alike).
#
#   docker compose run --rm build             npm ci + type-check + build dist/ + reproducibility check
#   docker compose run --rm dev               shell in the Node dev image (npm, scripts)
#   docker compose up web                     serve the built app (dist/) on http://127.0.0.1:8080
#   docker compose run --rm test-unit         unit tests in Chromium, Firefox and WebKit (no network)
#   docker compose run --rm test-e2e          end-to-end tests, local relay, no third-party requests
#   docker compose run --rm test-e2e-public   end-to-end tests over the real public relays and STUN
#   docker compose run --rm lighthouse        Lighthouse budgets (performance, accessibility, SEO)
#   docker compose run --rm trufflehog        secrets in the working tree and all of git history
#   docker compose run --rm semgrep           static analysis
#   docker compose run --rm trivy             vulnerable dependencies, misconfigurations, secrets
#
# All services: non-root user, no Linux capabilities, read-only root filesystem (writable /tmp
# only), no privilege escalation. The project is mounted read-only except for `dev`.

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  tmpfs:
    - /tmp:rw,size=1g
  environment:
    # Tools write their settings and caches under $HOME. The root filesystem is read-only, so
    # HOME points at the writable /tmp (a tmpfs, discarded after each run).
    HOME: /tmp

x-source-ro: &source-ro
  - ./:/work:ro

services:
  dev:
    build: { context: ., target: dev }
    image: secure-share/dev:local
    <<: *hardening
    volumes:
      - ./:/work

  # Installs the locked dependencies (no install scripts, >= 7 days old: .npmrc), type-checks,
  # builds dist/ and build/modules/, then builds again and fails unless the output is identical.
  # BUILD_REPOSITORY, BUILD_COMMIT and BUILD_SITE_URL are passed through when set (see build.mjs).
  build:
    build: { context: ., target: dev }
    image: secure-share/dev:local
    <<: *hardening
    environment:
      HOME: /tmp
      BUILD_REPOSITORY:
      BUILD_COMMIT:
      BUILD_SITE_URL:
    volumes:
      - ./:/work
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run build:check"]

  # Packages dist/ as a deterministic release tarball in release/ (run `build` first):
  #   docker compose run --rm package vX.Y.Z
  package:
    image: python:3.15.0-slim-bookworm@sha256:0e019bbdfb5d9874cb2389f1c2884b64aa2ac97c99960b5bc521cef978c0617d
    <<: *hardening
    user: "1000:1000"
    working_dir: /work
    network_mode: none
    volumes:
      - ./:/work
    entrypoint: ["python", "tools/package.py"]

  # Serves the built app exactly as it's deployed (run `build` first).
  web:
    image: python:3.15.0-slim-bookworm@sha256:0e019bbdfb5d9874cb2389f1c2884b64aa2ac97c99960b5bc521cef978c0617d
    <<: *hardening
    user: "1000:1000"
    working_dir: /work/dist
    volumes: *source-ro
    ports:
      - "127.0.0.1:8080:8080"          # reachable from this computer only
    command: ["python", "/work/tools/serve.py", "8080", "0.0.0.0"]

  test-unit:
    build: { context: ., target: test }
    image: secure-share/test:local
    <<: *hardening
    working_dir: /work
    volumes: *source-ro
    network_mode: none                 # unit tests need no network: loopback server + fake transport
    shm_size: 1gb                      # Chromium uses /dev/shm heavily
    command: ["python", "tests/unit/run.py", "chromium", "firefox", "webkit"]

  # End-to-end: users' flows through the real UI over real WebRTC (see docs/TESTING.md), against
  # the built app (run `build` first). Discovery uses the local relay in the test server and ICE
  # uses host candidates only. The browsers block every request that isn't to the local test
  # server and fail the run if the app tries one. (Not an `internal: true` network: browsers
  # gather no WebRTC candidates at all without a default route.)
  test-e2e:
    build: { context: ., target: test }
    image: secure-share/test:local
    <<: *hardening
    working_dir: /work
    volumes: *source-ro
    shm_size: 1gb
    command: ["python", "tests/e2e/run.py"]

  # Online: same scenarios against the live public relays and STUN servers (real-world networking).
  test-e2e-public:
    build: { context: ., target: test }
    image: secure-share/test:local
    <<: *hardening
    working_dir: /work
    volumes: *source-ro
    shm_size: 1gb
    command: ["python", "tests/e2e/run.py", "--public"]

  # Lighthouse on every page of the built site (run `build` first), against the budgets in
  # tools/lighthouse/budgets.json; fails the run if one isn't met. Reports go to .cache/lighthouse.
  lighthouse:
    build: { context: ., target: lighthouse }
    image: secure-share/lighthouse:local
    <<: *hardening
    working_dir: /work
    volumes:
      - ./:/work:ro
      - ./.cache/lighthouse:/reports    # HTML and JSON reports (git-ignored)
    environment:
      HOME: /tmp
      LIGHTHOUSE_OUT: /reports
    network_mode: none                 # the site is served on loopback inside the container
    shm_size: 1gb                      # Chromium uses /dev/shm heavily
    command: ["node", "tools/lighthouse/run.mjs"]

  trufflehog:
    image: trufflesecurity/trufflehog:3.99.2@sha256:47a84bc18a0d04a165498bbbd3bacfd84176661cbc91f8e0f85467f6a771e99a
    <<: *hardening
    user: "1000:1000"
    volumes: *source-ro
    network_mode: none                 # --no-verification: candidate secrets are never sent anywhere
    environment:
      HOME: /tmp
      # The mount belongs to another uid; tell git it's safe without writing a config file.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        echo "== git history" &&
        trufflehog git file:///work --no-update --no-verification --fail &&
        echo "== working tree" &&
        trufflehog filesystem /work --no-update --no-verification --fail
        --exclude-paths /work/.trufflehog-exclude

  semgrep:
    image: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    <<: *hardening
    user: "1000:1000"
    working_dir: /work
    volumes: *source-ro
    environment:
      HOME: /tmp                       # semgrep's settings and rule cache (the scan target is /work)
      SEMGREP_SEND_METRICS: "off"
    # Network: downloads the rule packs below from semgrep.dev.
    command: ["semgrep", "scan", "--metrics=off", "--error",
              "--config", "p/javascript", "--config", "p/typescript", "--config", "p/python",
              "--config", "p/dockerfile", "--config", "p/security-audit", "/work"]

  trivy:
    image: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    <<: *hardening
    user: "1000:1000"
    volumes:
      - ./:/work:ro
      - ./.cache/trivy:/cache          # vulnerability DB, kept between runs (git-ignored)
    # Network: downloads the vulnerability database.
    command: ["fs", "--cache-dir", "/cache", "--no-progress", "--skip-version-check",
              "--exit-code", "1", "--severity", "HIGH,CRITICAL",
              "--scanners", "vuln,misconfig,secret", "--skip-dirs", "/work/.venv",
              "--skip-dirs", "/work/node_modules", "--skip-dirs", "/work/.cache", "/work"]

