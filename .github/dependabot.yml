# Dependabot keeps every pinned dependency up to date, with the same 7-day minimum age as
# .npmrc (min-release-age=7): a new release is only proposed once it has been public for a week.
# Security updates are not delayed by the cooldown.
version: 2

updates:
  # Images used directly by compose.yaml (tests, scanners, web), pinned by tag + digest.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(compose)"

  # Base image of the dev Dockerfile (pinned by tag + digest).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(docker)"
    ignore:
      # The dev toolchain stays on Node LTS releases; a new major is adopted deliberately once it
      # becomes LTS (even majors, each October), not as soon as it's published.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # Test tooling (tests/requirements.txt, pinned with hashes; installed under pip.conf rules).
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(pip)"
    ignore:
      # Playwright pins its own dependencies (1.63: pyee>=13,<14); a pyee major arrives with the
      # Playwright update that allows it.
      - dependency-name: pyee
        update-types: ["version-update:semver-major"]

  # npm packages (package.json / package-lock.json, from roadmap 0.6.0 on).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(npm)"

  # Lighthouse, for the budgets in CI (tools/lighthouse/package-lock.json; not part of the app).
  - package-ecosystem: npm
    directory: /tools/lighthouse
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(npm)"

  # GitHub Actions used by CI (pinned by commit SHA).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(actions)"
