name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner (test tooling only, not a runtime dependency)
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium firefox

      # Same command as on a developer machine (see docs/TESTING.md).
      - name: Run browser tests
        run: python tests/run_headless.py chromium firefox

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Only allow-listed external origins in the app
        run: |
          # Any new external URL in shipped code must be reviewed and added here on purpose.
          allowed='https://cdn\.jsdelivr\.net(/npm/trystero@0\.26\.0/\+esm)?;?$|https://github\.com/dmotz/trystero$'
          if grep -rnoE "https?://[^'\" )>]+" index.html src | grep -vE "$allowed"; then
            echo "::error::Unexpected external URL in shipped code (see above)"
            exit 1
          fi

      - name: No innerHTML / eval in shipped code
        run: |
          if grep -rnE "innerHTML|outerHTML|insertAdjacentHTML|eval\(|new Function\(" src | grep -vE ':[0-9]+:\s*//'; then
            echo "::error::Unsafe DOM/code API used"
            exit 1
          fi
