name: Deploy to GitHub Pages

# Publishes the built app (dist/) on every push to main. The build runs in the same pinned
# container as everywhere else and must be reproducible; its SHA256SUMS ship with the site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Type-check, build, and check the build is reproducible
        env:
          # The footer links to this repository (a fork deploys with a link to itself).
          BUILD_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: chmod a+rwX . && docker compose run --rm build
      - name: Checksums of what is being deployed
        run: cat dist/SHA256SUMS
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # publish the site
      id-token: write   # prove to GitHub Pages that this workflow produced it
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
